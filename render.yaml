services:
  - type: web
    name: makatron-broker-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: MASTER_SEED
        sync: false
      - key: DATABASE_URL
        sync: false
