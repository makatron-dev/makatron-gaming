<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKATRON GAMING</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #222; border-bottom: 2px solid #333; }
        #logo { color: #ff4d4d; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        #wallet { color: #28a745; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        #wallet button { padding: 5px 10px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; }
        #stats-bar { display: flex; justify-content: space-between; padding: 10px 20px; background-color: #111; border-bottom: 1px solid #333; font-size: 0.9rem; align-items: center; }
        #history-container { display: flex; gap: 5px; }
        .history-item { padding: 3px 8px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; }
        .h-low { background-color: #ff4d4d; color: white; }
        .h-mid { background-color: #007bff; color: white; }
        .h-high { background-color: #9b59b6; color: white; }
        #hash-display { color: #00ffcc; font-family: monospace; font-size: 0.8rem; }
        #highest-win { color: #ffc107; font-weight: bold; }
        #game-area { position: relative; flex-grow: 1; background-color: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #progress-bar { position: absolute; top: 0; left: 0; height: 4px; background-color: #ffc107; width: 0%; }
        #multiplier { font-size: 6rem; font-weight: bold; color: #fff; z-index: 10; transition: color 0.2s; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .crashed { color: #ff4d4d !important; text-shadow: 0 0 20px rgba(255,77,77,0.4); }
        #status { position: absolute; top: 20px; left: 20px; color: #aaa; font-size: 1.2rem; }
        #curve-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
        #betting-panels { display: flex; justify-content: space-around; padding: 15px; background-color: #222; border-top: 2px solid #333; }
        .panel { background-color: #333; padding: 15px; border-radius: 10px; width: 45%; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; justify-content: space-between; align-items: center; background-color: #444; padding: 5px; border-radius: 5px; }
        .input-group button { background-color: #555; color: white; border: none; width: 40px; height: 40px; font-size: 1.5rem; cursor: pointer; border-radius: 5px; }
        .input-group button:hover { background-color: #777; }
        .input-group input { background: transparent; border: none; color: white; font-size: 1.2rem; text-align: center; width: 100%; outline: none; }
        .main-btn { padding: 15px; font-size: 1.2rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: all 0.2s; }
        .bet-btn { background-color: #28a745; color: white; }
        .cashout-btn { background-color: #ffc107; color: black; }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="header">
        <div id="logo">MAKATRON GAMING</div>
        <div id="wallet">
            Balance: <span id="balance-amount">--</span> Coins 
            <button onclick="requestDeposit()">+ Add 500</button>
        </div>
    </div>

    <div id="stats-bar">
        <div id="history-container"></div>
        <div id="hash-display">Server Hash: Waiting...</div>
        <div>Highest Win Today: <span id="highest-win">0.00</span> Coins</div>
    </div>

    <div id="game-area">
        <div id="progress-bar"></div>
        <div id="status">Connecting...</div>
        <div id="multiplier">1.00x</div>
        <canvas id="curve-canvas"></canvas>
    </div>

    <div id="betting-panels">
        <div class="panel">
            <div class="input-group">
                <button onclick="changeBet('panel1', -100)">-</button>
                <input type="number" id="panel1-bet" value="100" min="100" step="100">
                <button onclick="changeBet('panel1', 100)">+</button>
            </div>
            <div class="input-group">
                <span style="padding-left:10px;">Auto Cashout:</span>
                <input type="number" id="panel1-auto" value="2.00" step="0.1" min="1.01" max="100">
            </div>
            <button id="panel1-btn" class="main-btn bet-btn" onclick="handleAction('panel1')" disabled>Bet</button>
        </div>
        <div class="panel">
            <div class="input-group">
                <button onclick="changeBet('panel2', -100)">-</button>
                <input type="number" id="panel2-bet" value="100" min="100" step="100">
                <button onclick="changeBet('panel2', 100)">+</button>
            </div>
            <div class="input-group">
                <span style="padding-left:10px;">Auto Cashout:</span>
                <input type="number" id="panel2-auto" value="2.00" step="0.1" min="1.01" max="100">
            </div>
            <button id="panel2-btn" class="main-btn bet-btn" onclick="handleAction('panel2')" disabled>Bet</button>
        </div>
    </div>

    <script>
        // IMPORTANT: Change this line after deploying your server to Render!
        const ws = new WebSocket("ws://localhost:8765");
        
        const canvas = document.getElementById("curve-canvas");
        const ctx = canvas.getContext("2d");
        const progressBar = document.getElementById("progress-bar");
        
        let isBetting = { panel1: false, panel2: false };
        let autoCashout = { panel1: false, panel2: false };
        let currentMultiplier = 1.00;
        let balance = 0;
        let currentBetAmounts = { panel1: 0, panel2: 0 };

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        ws.onopen = () => { document.getElementById("status").innerText = "Connected!"; };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === "balance") {
                balance = data.amount;
                document.getElementById("balance-amount").innerText = balance;
            }
            else if (data.type === "commit") {
                document.getElementById("hash-display").innerText = "Hash: " + data.server_seed_hash.substring(0, 16) + "...";
            }
            else if (data.type === "history") {
                const container = document.getElementById("history-container");
                container.innerHTML = "";
                data.history.forEach(mult => {
                    const span = document.createElement("span");
                    span.className = "history-item";
                    if (mult < 2.0) span.classList.add("h-low");
                    else if (mult < 10.0) span.classList.add("h-mid");
                    else span.classList.add("h-high");
                    span.innerText = mult.toFixed(2) + "x";
                    container.appendChild(span);
                });
            }
            else if (data.type === "highest_win") {
                document.getElementById("highest-win").innerText = data.amount.toFixed(2);
            }
            else if (data.type === "waiting") {
                document.getElementById("status").innerText = "Place your bets!";
                document.getElementById("multiplier").innerText = "1.00x";
                document.getElementById("multiplier").classList.remove("crashed");
                resetPanel('panel1');
                resetPanel('panel2');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.transition = `width ${data.duration}s linear`;
                    progressBar.style.width = '100%';
                }, 50);
            }
            else if (data.type === "tick") {
                currentMultiplier = data.multiplier;
                document.getElementById("multiplier").innerText = currentMultiplier.toFixed(2) + "x";
                document.getElementById("multiplier").classList.remove("crashed");
                document.getElementById("status").innerText = "Flying!";
                updateButtonText('panel1');
                updateButtonText('panel2');
                drawPlane(currentMultiplier);
                checkAutoCashout('panel1');
                checkAutoCashout('panel2');
            } 
            else if (data.type === "crash") {
                document.getElementById("multiplier").innerText = data.multiplier.toFixed(2) + "x";
                document.getElementById("multiplier").classList.add("crashed");
                document.getElementById("status").innerText = "Crashed! Seed: " + data.server_seed.substring(0, 10) + "...";
                resetPanel('panel1');
                resetPanel('panel2');
            }
            else if (data.type === "error") { alert(data.message); }
        };

        function updateButtonText(panelId) {
            if (isBetting[panelId]) {
                const btn = document.getElementById(panelId + "-btn");
                const winAmount = Math.floor(currentBetAmounts[panelId] * currentMultiplier);
                btn.innerText = `Cashout: ${winAmount}`;
            }
        }

        function resetPanel(panelId) {
            const btn = document.getElementById(panelId + "-btn");
            btn.innerText = "Bet";
            btn.className = "main-btn bet-btn";
            btn.disabled = false;
            isBetting[panelId] = false;
            autoCashout[panelId] = false;
            currentBetAmounts[panelId] = 0;
        }

        function changeBet(panelId, amount) {
            const input = document.getElementById(panelId + "-bet");
            let newVal = (parseInt(input.value) || 0) + amount;
            if (newVal < 100) newVal = 100;
            if (newVal > balance) newVal = balance;
            input.value = newVal;
        }

        function handleAction(panelId) {
            const input = document.getElementById(panelId + "-bet");
            let amount = parseInt(input.value) || 0;
            if (amount < 100) { amount = 100; input.value = 100; }

            if (!isBetting[panelId]) {
                if (amount > balance) { alert("Not enough coins!"); return; }
                ws.send(JSON.stringify({ action: "bet", panel: panelId, amount: amount }));
                isBetting[panelId] = true;
                currentBetAmounts[panelId] = amount;
                document.getElementById(panelId + "-btn").className = "main-btn cashout-btn";
                const autoVal = parseFloat(document.getElementById(panelId + "-auto").value);
                if (autoVal > 1.00) { autoCashout[panelId] = autoVal; }
            } else {
                ws.send(JSON.stringify({ action: "cashout", panel: panelId, multiplier: currentMultiplier }));
                isBetting[panelId] = false;
                const btn = document.getElementById(panelId + "-btn");
                btn.innerText = "Cashed Out!";
                btn.disabled = true;
            }
        }

        function checkAutoCashout(panelId) {
            if (isBetting[panelId] && autoCashout[panelId] > 1.00 && currentMultiplier >= autoCashout[panelId]) {
                ws.send(JSON.stringify({ action: "cashout", panel: panelId, multiplier: currentMultiplier }));
                isBetting[panelId] = false;
                document.getElementById(panelId + "-btn").innerText = `Auto @ ${currentMultiplier.toFixed(2)}x`;
                document.getElementById(panelId + "-btn").disabled = true;
            }
        }

        function requestDeposit() {
            if (ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ action: "deposit", amount: 500 })); }
        }

        function drawPlane(multiplier) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let crashX = (multiplier - 1.00) * 50;
            let crashY = canvas.height - (multiplier - 1.00) * 30;
            ctx.beginPath(); ctx.moveTo(0, canvas.height); ctx.lineTo(crashX, crashY);
            ctx.strokeStyle = "#ff4d4d"; ctx.lineWidth = 4; ctx.stroke();
            ctx.beginPath(); ctx.arc(crashX, crashY, 10, 0, 2 * Math.PI);
            ctx.fillStyle = "#fff"; ctx.shadowColor = "#ff4d4d"; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>
